# CI 基线（M0 收尾项，总计划 RISK-2026-003 的解除条件：Linux CI 门禁）。
# 门禁：PR 与 master push 必须全绿；按 preset 矩阵覆盖 Linux 三档与 Windows。
# 测试集：ctest 全量（unit / smoke / integration）。
# M3-01（DEC-006）：heyaki 单图接入——首次配置前经
# third_party/heyaki/scripts/fetch_third_party.sh 拉取 pinned 依赖树
# （ref+commit 双校验，actions/cache 缓存）；Linux 装 libssl-dev；
# Windows 注入 OPENSSL_ROOT_DIR（runner 预装 OpenSSL 3）；tsan preset 联动
# HEYAKI_SANITIZER=thread（CMakePresets，全图插桩）。
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: OpenSSL 3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-linux-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：runtime + test + optional 全组拉取——heyaki 许可证清单校验
        # 无条件覆盖全部 lock 条目（缺 googletest/zstd 许可证文件即 FATAL，
        # CI run 35893280000 实测），与 BUILD_TESTING 开关无关。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  windows:
    name: Windows / debug (MSVC)
    runs-on: windows-latest
    env:
      OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-windows-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：与 Linux job 同因（heyaki 许可证清单无条件全组校验）。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
        shell: bash
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --config Debug --parallel
      - name: Test
        run: ctest --preset debug -C Debug --output-on-failure
