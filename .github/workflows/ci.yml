# CI 基线（M0 收尾项，总计划 RISK-2026-003 的解除条件：Linux CI 门禁）。
# 门禁：PR 与 master push 必须全绿；按 preset 矩阵覆盖 Linux 三档与 Windows。
# 测试集：ctest 全量（unit / smoke / integration）。
# M3-01（DEC-006）：heyaki 单图接入——首次配置前经
# third_party/heyaki/scripts/fetch_third_party.sh 拉取 pinned 依赖树
# （ref+commit 双校验，actions/cache 缓存）；Linux 装 libssl-dev；
# Windows 注入 OPENSSL_ROOT_DIR（runner 预装 OpenSSL 3）；tsan preset 联动
# HEYAKI_SANITIZER=thread（CMakePresets，全图插桩）。
# M5-02（DEC-014）：EUI-NEO 并入单一构建图——Linux 三档加装 pinned 集成
# 指南完整系统依赖集（libcurl 非 Windows REQUIRED；tray SNI 走 glib/gio、
# GLFW Wayland 保持上游默认 ON，不做 CI 专属降档）；tsan（及 asan/ubsan）
# 对 eui_neo 与 bundled 第三方全图插桩零豁免——eui 栈 CI 覆盖 = 编译+链接
# 插桩，ctest 执行面为 console 测试（不链 eui），渲染/UI 运行期证据走本机
# 归档（RULE-11），不得宣称「UI/渲染经 TSAN 验证」。Windows 零新增依赖
#（CURL QUIET 可选、tray 走 WINAPI）。
# M6-02（DEC-017）：新增 package-linux / package-windows 打包 job——
# Ubuntu 20.04 容器 release 构建 + CPack DEB（/opt/aki 布局，静态
# libstdc++），Windows release + CPack NSIS setup.exe；产物随 workflow
# artifacts 交付。门禁五档矩阵（debug/asan/ubsan/tsan + Windows debug）
# 语义不变。
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, ubsan, tsan]
    env:
      # TSAN 抑制表：usrsctp（libdatachannel vendored 依赖）内部数据竞争——
      # 上游 C 代码非 TSAN-clean（CI run 35943203897 实测
      # sctp_output.c:7581 sctp_toss_old_cookies），按供应链纪律不改
      # third_party，以抑制表记录（M3 里程碑验证有档案）。DEC-014 起 EUI
      # bundled 第三方（glfw/freetype 等）上游竞态沿用同一登记制。非 tsan
      # 预设的二进制不读该变量，无影响。
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/tsan-suppressions.supp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System dependencies (OpenSSL + EUI-NEO backend set)
        # DEC-014：完整集来自 pinned 集成指南（third_party/EUI-NEO/docs/
        # 集成指南.md Ubuntu 集）；runner 仅预装 libssl-dev/pkg-config，
        # 其余必须显式安装（含 wayland-protocols——GLFW Wayland scanner
        # 依赖）。tray/Wayland 不降档（保留 CI 编译覆盖）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libglib2.0-dev
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-linux-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：runtime + test + optional 全组拉取——heyaki 许可证清单校验
        # 无条件覆盖全部 lock 条目（缺 googletest/zstd 许可证文件即 FATAL，
        # CI run 35893280000 实测），与 BUILD_TESTING 开关无关。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  windows:
    name: Windows / debug (MSVC)
    runs-on: windows-latest
    env:
      OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-windows-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：与 Linux job 同因（heyaki 许可证清单无条件全组校验）。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
        shell: bash
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --config Debug --parallel
      - name: Test
        run: ctest --preset debug -C Debug --output-on-failure

  # M6-02（DEC-017）：CI 打包——release 产物经 CPack 生成安装包并作为
  # workflow artifacts 交付（PR 与 master push 均产出）。
  # deb（package-linux）：最低适配 Ubuntu 20.04，GitHub ubuntu-20.04 runner
  # 已退役，改用 ubuntu:20.04 容器构建——glibc 2.31 即 20.04 原生基线；
  # EUI-NEO 硬性要求 GCC>=12（focal 官方仓库最高 gcc-10），经
  # ubuntu-toolchain-r/test PPA 装 gcc-12；focal 自带 cmake 3.16 < 3.25
  #（工程规范），经 Kitware APT 源补齐；产物静态链接 libstdc++/libgcc
  #（不要求用户侧 GLIBCXX 新版本，glibc 保持 2.31 动态基线）；Depends 由
  # dpkg-shlibdeps 扫描安装树生成（容器即 20.04 库版本，基线随之锁定）。
  # setup.exe（package-windows）：NSIS（runner 预装）打包 Release 构建
  #（MSVC Debug CRT 不可再分发，打包一律 Release——DEC-017）。
  package-linux:
    name: Linux / package deb (Ubuntu 20.04)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System dependencies (cmake >= 3.25 via Kitware, GCC 12 via PPA, EUI-NEO backend set, dpkg tooling)
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates curl gnupg git software-properties-common \
            dpkg-dev file
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' \
            > /etc/apt/sources.list.d/kitware.list
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y \
            cmake \
            gcc-12 \
            g++-12 \
            libssl-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libglib2.0-dev
      - name: Build OpenSSL 3.5 LTS (focal ships 1.1; heyaki freezes the OpenSSL 3.x ABI)
        # focal 系统 OpenSSL 为 1.1.1f，pinned heyaki 要求 >=3.0 且 <4.0
        #（third_party/heyaki/CMakeLists.txt:116）——源码构建 shared 到
        # /usr/local 供构建图链接；运行期由 AKI_BUNDLE_OPENSSL_LINUX 随包
        # 分发 libssl.so.3/libcrypto.so.3（DEC-017）。tarball SHA-256 固定
        # 校验（3.5 LTS，2026-09-28 取自 GitHub release）。
        run: |
          curl -fsSLO https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          echo "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99  openssl-3.5.4.tar.gz" | sha256sum -c -
          tar -xzf openssl-3.5.4.tar.gz
          cd openssl-3.5.4
          ./Configure linux-x86_64 shared no-tests --prefix=/usr/local --libdir=lib
          make -j"$(nproc)"
          make install_sw
          ldconfig
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-linux-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：与门禁 Linux job 同因（heyaki 许可证清单无条件全组校验）。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
      - name: Configure (release)
        run: >
          cmake --preset release
          -D CMAKE_C_COMPILER=gcc-12
          -D CMAKE_CXX_COMPILER=g++-12
          -D CMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          -D OPENSSL_ROOT_DIR=/usr/local
          -D AKI_BUNDLE_OPENSSL_LINUX=ON
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Package (DEB)
        working-directory: build/release
        run: cpack -G DEB
      - name: Package sanity (dpkg metadata + layout)
        run: |
          dpkg-deb -I build/release/aki_*.deb
          dpkg-deb -c build/release/aki_*.deb | head -40
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: aki-ubuntu20.04-amd64-deb
          path: build/release/*.deb
          if-no-files-found: error

  package-windows:
    name: Windows / package setup.exe (MSVC)
    runs-on: windows-latest
    env:
      OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Heyaki pinned dependencies
        uses: actions/cache@v4
        with:
          path: third_party/heyaki/third_party
          key: heyaki-deps-windows-${{ hashFiles('third_party/heyaki/third_party/dependencies.lock') }}
      - name: Fetch heyaki dependencies (ref+commit verified)
        # --all：与门禁 Windows job 同因（heyaki 许可证清单无条件全组校验）。
        run: bash third_party/heyaki/scripts/fetch_third_party.sh --all
        shell: bash
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --config Release --parallel
      - name: Test
        run: ctest --preset release -C Release --output-on-failure
      - name: Package (NSIS setup.exe)
        working-directory: build/release
        run: cpack -C Release -G NSIS
      - name: Package sanity (installer artifact present)
        shell: bash
        run: ls -l build/release/aki-*-setup.exe
      - name: Upload setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: aki-windows-setup
          path: build/release/aki-*-setup.exe
          if-no-files-found: error
